name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Node ${{ matrix.node }} / ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node: [20]
                include:
                    - os: ubuntu-latest
                      node: 22
                    - os: ubuntu-latest
                      node: 24
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
              with:
                  version: 10.13.1
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm compile
            - run: pnpm lint
            - run: pnpm test --runInBand
            - run: pnpm package:check

    installed-package:
        name: Installed npm tarball
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
              with:
                  version: 10.13.1
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 20
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm package:check
            - run: mkdir package-test && npm pack --pack-destination package-test
            - run: npm install --global ./package-test/*.tgz
            - run: gami version --json
            - run: gami --help
