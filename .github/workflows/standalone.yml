name: Build standalone verifier

on:
    push:
        tags: ["v*", "test-v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: ${{ matrix.platform }} / ${{ matrix.arch }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      platform: windows
                      arch: x64
                    - os: ubuntu-22.04
                      platform: linux
                      arch: x64
                    - os: ubuntu-24.04-arm
                      platform: linux
                      arch: arm64
                    - os: macos-15-intel
                      platform: macos
                      arch: x64
                    - os: macos-15
                      platform: macos
                      arch: arm64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        environment: ${{ startsWith(github.ref, 'refs/tags/') && matrix.platform != 'macos' && format('{0}-signing', matrix.platform) || 'standalone-preview' }}
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
              with:
                  version: 10.13.1
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22.23.3
                  architecture: ${{ matrix.arch }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm compile
            - run: pnpm lint
            - run: pnpm test --runInBand
            - run: pnpm build:standalone
            - run: pnpm test:standalone
            - name: Azure login
              if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows'
              uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Sign Windows executable
              if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows'
              uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
              with:
                  endpoint: https://neu.codesigning.azure.net
                  signing-account-name: authenticmemorysigning
                  certificate-profile-name: gami-public-signing
                  files: ${{ github.workspace }}\release\standalone\gami-verify.exe
                  exclude-environment-credential: true
            - name: Verify Windows publisher and timestamp
              if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows'
              shell: pwsh
              run: |
                  $signature = Get-AuthenticodeSignature release/standalone/gami-verify.exe
                  $organization = "Authentic Memory gemeinn$([char]0x00fc)tzige UG (haftungsbeschr$([char]0x00e4)nkt)"
                  if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -notmatch ('(?:^|,\s*)O=' + [regex]::Escape($organization) + '(?:,|$)')) {
                    throw 'Expected valid timestamped Authentic Memory signature'
                  }
            - run: pnpm test:standalone
            - run: pnpm package:standalone
            - name: Sign and independently verify Linux archives
              if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'linux'
              shell: bash
              env:
                  LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
                  LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
                  LINUX_SIGNING_FINGERPRINT: ${{ vars.LINUX_SIGNING_FINGERPRINT }}
              run: bash scripts/sign-linux.sh release/downloads release/downloads/*.tar.gz release/downloads/*.cdx.json release/downloads/*.sha256
            - name: Attest packaged artifacts
              if: startsWith(github.ref, 'refs/tags/')
              uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
              with:
                  subject-path: release/downloads/*
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: gami-verify-${{ matrix.platform }}-${{ matrix.arch }}${{ (matrix.platform == 'macos' || !startsWith(github.ref, 'refs/tags/')) && '-unsigned-preview' || '' }}
                  path: release/downloads/*
                  if-no-files-found: error
                  retention-days: 30

    publish-downloads:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22.23.3
            - uses: actions/download-artifact@v4
              with:
                  pattern: gami-verify-*
                  path: release/artifacts
            - name: Collect signed platforms only
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p release/downloads
                  for platform in windows-x64 linux-x64 linux-arm64; do
                    cp release/artifacts/gami-verify-$platform/* release/downloads/
                  done
                  node scripts/create-download-manifest.mjs
            - name: Publish complete signed downloads
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
                  fi
                  test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to replace a published release'; exit 1; }
                  gh release upload "$GITHUB_REF_NAME" release/downloads/*
                  gh release edit "$GITHUB_REF_NAME" --draft=false --latest
            - name: Trigger full Netlify site rebuild
              env:
                  NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
              shell: bash
              run: |
                  set -euo pipefail
                  test -n "$NETLIFY_BUILD_HOOK" || { echo 'Set NETLIFY_BUILD_HOOK to enable automatic website deployment'; exit 1; }
                  curl --fail --silent --show-error --retry 3 --request POST "$NETLIFY_BUILD_HOOK" --output /dev/null
