name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
              with:
                  version: 10.13.1
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - name: Install npm with OIDC trusted-publishing support
              run: npm install --global npm@12.0.2
            - run: pnpm compile && pnpm lint && pnpm test --runInBand
            - run: pnpm package:check
            - name: Check tag matches package version
              if: github.event_name == 'push'
              run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
            - name: Build release artifacts
              run: |
                  mkdir release
                  npm pack --pack-destination release
                  pnpm release:artifacts "release/$(ls release/*.tgz | xargs basename)" release
            - name: Attest tarball, SBOM, and checksums
              uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
              with:
                  subject-path: release/*
            - name: Publish to npm with registry provenance
              if: github.event_name == 'push'
              run: npm publish release/*.tgz --access public --provenance
            - name: Create GitHub release
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
